name: Atualizar Lotofácil

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Buscar ultimo concurso
        run: |

          python - <<'PY'

          import json
          import urllib.request

          base = "https://raw.githubusercontent.com/maickon/free-apiloterias/refs/heads/master/database/lotofacil"

          url = base + "/_ultimo.json"

          print("🍀 Consultando último concurso...")

          with urllib.request.urlopen(url, timeout=60) as resposta:
              ultimo = json.load(resposta)

          concurso_atual = int(ultimo["concurso"])

          print("🍀 Último concurso encontrado:", concurso_atual)

          resultados = {}

          inicio = max(1, concurso_atual - 39)

          for numero in range(
              concurso_atual,
              inicio - 1,
              -1
          ):

              try:

                  url = base + "/" + str(numero) + ".json"

                  print("Buscando concurso:", numero)

                  with urllib.request.urlopen(
                      url,
                      timeout=30
                  ) as resposta:

                      dados = json.load(resposta)

                  dezenas = dados.get("dezenas")

                  if dezenas is None:
                      dezenas = dados.get("Dezenas")

                  if isinstance(dezenas, str):

                      dezenas = [
                          int(x)
                          for x in dezenas.replace(",", " ").split()
                      ]

                  else:

                      dezenas = [
                          int(x)
                          for x in dezenas
                      ]

                  if (
                      len(dezenas) == 15
                      and all(1 <= x <= 25 for x in dezenas)
                  ):

                      resultados[str(numero)] = dezenas

              except Exception as erro:

                  print(
                      "Não foi possível carregar",
                      numero,
                      ":",
                      erro
                  )

          if not resultados:

              raise Exception(
                  "Nenhum resultado foi encontrado."
              )

          with open(
              "resultados.json",
              "w",
              encoding="utf-8"
          ) as arquivo:

              json.dump(
                  resultados,
                  arquivo,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print("==============================")
          print("🍀 OUR LOTTERY")
          print("==============================")
          print(
              "Último concurso salvo:",
              max(resultados.keys(), key=int)
          )
          print(
              "Total de concursos:",
              len(resultados)
          )
          print("==============================")

          PY


      - name: Conferir resultados
        run: |

          python - <<'PY'

          import json

          with open(
              "resultados.json",
              "r",
              encoding="utf-8"
          ) as arquivo:

              dados = json.load(arquivo)

          ultimo = max(
              dados.keys(),
              key=int
          )

          print(
              "🍀 Último concurso:",
              ultimo
          )

          print(
              "📊 Total:",
              len(dados)
          )

          print(
              "🔢 Dezenas:",
              dados[ultimo]
          )

          PY


      - name: Salvar resultados
        run: |

          git config user.name "Our Lottery"

          git config user.email "actions@github.com"

          git add resultados.json

          if git diff --cached --quiet; then

              echo "ℹ️ Nenhuma alteração."

          else

              git commit -m "🍀 Atualizar resultados Lotofácil"

              git push

              echo "✅ Resultados atualizados."

          fi          
