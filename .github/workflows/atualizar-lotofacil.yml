name: Atualizar Lotofácil

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"
    - cron: "30 4 * * *"
    - cron: "30 12 * * *"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Buscar últimos 40 concursos
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import time

          BASE = "https://raw.githubusercontent.com/maickon/free-apiloterias/refs/heads/master/database/lotofacil"

          def buscar(url):
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Our Lottery"}
              )

              for tentativa in range(3):
                  try:
                      with urllib.request.urlopen(req, timeout=30) as r:
                          return json.loads(r.read().decode("utf-8"))
                  except Exception as e:
                      print("Tentativa", tentativa + 1, "falhou:", e)
                      time.sleep(2)

              raise Exception("Não foi possível acessar " + url)

          print("🍀 Procurando último concurso...")

          ultimo = buscar(BASE + "/_ultimo.json")

          numero_atual = int(
              ultimo.get("concurso")
              or ultimo.get("Concurso")
              or ultimo.get("numero")
              or ultimo.get("Numero")
          )

          print("Último concurso:", numero_atual)

          resultados = {}

          for numero in range(numero_atual, numero_atual - 40, -1):

              try:
                  dados = buscar(
                      BASE + "/" + str(numero) + ".json"
                  )

                  dezenas = (
                      dados.get("dezenas")
                      or dados.get("Dezenas")
                      or dados.get("listaDezenas")
                  )

                  if isinstance(dezenas, str):
                      dezenas = [
                          int(x)
                          for x in dezenas.replace(",", " ").split()
                      ]
                  else:
                      dezenas = [int(x) for x in dezenas]

                  dezenas = list(dict.fromkeys(dezenas))

                  if len(dezenas) == 15 and all(1 <= x <= 25 for x in dezenas):
                      resultados[str(numero)] = dezenas
                      print("✅ Concurso", numero)

              except Exception as erro:
                  print("⚠️ Concurso", numero, ":", erro)

          if len(resultados) < 40:
              raise Exception(
                  "Foram encontrados apenas "
                  + str(len(resultados))
                  + " concursos."
              )

          with open("resultados.json", "w", encoding="utf-8") as f:
              json.dump(
                  resultados,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("================================")
          print("🍀 OUR LOTTERY")
          print("Último:", max(map(int, resultados)))
          print("Total:", len(resultados))
          print("================================")
          PY

      - name: Salvar resultados
        run: |
          git config user.name "Our Lottery"
          git config user.email "actions@github.com"

          git add resultados.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteração."
          else
            git commit -m "🍀 Atualizar Lotofácil"
            git push
          fi
