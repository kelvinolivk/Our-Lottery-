name: Atualizar Lotofácil

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"
    - cron: "0 4 * * *"
    - cron: "0 13 * * *"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Buscar resultados
        run: |

          python - <<'PY'

          import json
          import urllib.request
          import ssl
          import re
          import time

          URL = "https://www.somatematica.com.br/lotofacil.php"

          headers = {
              "User-Agent": "Mozilla/5.0"
          }

          def baixar():

              req = urllib.request.Request(
                  URL,
                  headers=headers
              )

              for tentativa in range(3):

                  try:

                      with urllib.request.urlopen(
                          req,
                          timeout=30,
                          context=ssl.create_default_context()
                      ) as resposta:

                          return resposta.read().decode(
                              "utf-8",
                              errors="ignore"
                          )

                  except Exception as erro:

                      print(
                          "Tentativa",
                          tentativa + 1,
                          "falhou:",
                          erro
                      )

                      time.sleep(3)

              raise Exception(
                  "Não foi possível acessar o site."
              )


          print("🍀 OUR LOTTERY")
          print("🔎 Buscando resultados...")

          html = baixar()


          # Remove tags HTML
          texto = re.sub(
              r"<[^>]+>",
              " ",
              html
          )

          texto = re.sub(
              r"\s+",
              " ",
              texto
          )


          resultados = {}


          # Procura concursos
          encontrados = re.finditer(
              r"Concurso\s+(\d+)",
              texto,
              re.IGNORECASE
          )


          for encontrado in encontrados:

              numero = int(
                  encontrado.group(1)
              )

              inicio = encontrado.end()

              trecho = texto[
                  inicio:inicio + 1000
              ]


              numeros = re.findall(
                  r"\b(?:0?[1-9]|1[0-9]|2[0-5])\b",
                  trecho
              )


              numeros = [
                  int(x)
                  for x in numeros
              ]


              # Remove duplicados
              numeros = list(
                  dict.fromkeys(numeros)
              )


              if len(numeros) >= 15:

                  dezenas = numeros[:15]


                  if len(dezenas) == 15:

                      resultados[
                          str(numero)
                      ] = dezenas


          # Ordenar
          resultados = dict(
              sorted(
                  resultados.items(),
                  key=lambda x: int(x[0]),
                  reverse=True
              )
          )


          # Pegar 40
          resultados = dict(
              list(resultados.items())[:40]
          )


          if len(resultados) < 40:

              raise Exception(
                  "Foram encontrados apenas "
                  + str(len(resultados))
                  + " concursos."
              )


          ultimo = next(
              iter(resultados)
          )


          print()
          print("==============================")
          print("🍀 OUR LOTTERY")
          print("==============================")
          print(
              "Último:",
              ultimo
          )
          print(
              "Total:",
              len(resultados)
          )
          print("==============================")


          with open(
              "resultados.json",
              "w",
              encoding="utf-8"
          ) as arquivo:

              json.dump(
                  resultados,
                  arquivo,
                  ensure_ascii=False,
                  indent=2
              )


          print(
              "✅ resultados.json criado."
          )

          PY


      - name: Salvar resultados
        run: |

          git config user.name "Our Lottery"
          git config user.email "actions@github.com"

          git add resultados.json

          if git diff --cached --quiet; then

            echo "Nenhuma alteração."

          else

            git commit -m "🍀 Atualizar Lotofácil"

            git push

          fi
