name: Atualizar Lotofácil

on:
  workflow_dispatch:
  schedule:
    # Executa todos os dias às 12:30 UTC
    # = 09:30 no horário de Brasília
    - cron: "30 12 * * *"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Atualizar resultados
        run: |

          python - <<'PY'

          import json
          import urllib.request
          import re

          URL = "https://www.ric.com.br/loterias/lotofacil/"

          headers = {
              "User-Agent": "Mozilla/5.0"
          }

          req = urllib.request.Request(
              URL,
              headers=headers
          )

          with urllib.request.urlopen(
              req,
              timeout=30
          ) as resposta:

              html = resposta.read().decode(
                  "utf-8",
                  errors="ignore"
              )


          # Procurar concursos no conteúdo
          padrao = re.compile(
              r"Lotofácil\s+(\d+).*?"
              r"((?:\d{1,2}\s*[-–]\s*){14}\d{1,2})",
              re.IGNORECASE |
              re.DOTALL
          )


          resultados = {}


          for match in padrao.finditer(html):

              concurso = int(match.group(1))

              numeros = re.findall(
                  r"\d{1,2}",
                  match.group(2)
              )

              numeros = [
                  int(n)
                  for n in numeros
                  if 1 <= int(n) <= 25
              ]

              if len(numeros) == 15:

                  resultados[
                      str(concurso)
                  ] = numeros


          if not resultados:

              raise Exception(
                  "Nenhum concurso encontrado."
              )


          # Ordenar do mais novo para o mais antigo
          resultados = dict(
              sorted(
                  resultados.items(),
                  key=lambda x: int(x[0]),
                  reverse=True
              )
          )


          # Guardar somente os 40 mais recentes
          resultados = dict(
              list(resultados.items())[:40]
          )


          ultimo = next(
              iter(resultados)
          )


          print("🍀 OUR LOTTERY")
          print("Último concurso encontrado:", ultimo)
          print("Total de concursos:", len(resultados))


          # Segurança:
          # nunca substituir o arquivo por uma fonte
          # que esteja mais atrasada que o arquivo atual.

          try:

              with open(
                  "resultados.json",
                  "r",
                  encoding="utf-8"
              ) as arquivo:

                  atual = json.load(arquivo)

              ultimo_atual = max(
                  int(x)
                  for x in atual.keys()
              )

          except Exception:

              ultimo_atual = 0


          if int(ultimo) < ultimo_atual:

              raise Exception(
                  "A fonte está atrasada. "
                  "Arquivo atual: "
                  + str(ultimo_atual)
                  + " | Fonte: "
                  + str(ultimo)
              )


          with open(
              "resultados.json",
              "w",
              encoding="utf-8"
          ) as arquivo:

              json.dump(
                  resultados,
                  arquivo,
                  ensure_ascii=False,
                  indent=2
              )


          print(
              "✅ resultados.json atualizado."
          )

          PY


      - name: Salvar alterações
        run: |

          git config user.name "Our Lottery"
          git config user.email "actions@github.com"

          git add resultados.json

          if git diff --cached --quiet; then

            echo "Nenhuma alteração."

          else

            git commit -m "🍀 Atualizar Lotofácil"

            git push

          fi
