name: Atualizar Lotofácil

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"
    - cron: "30 4 * * *"
    - cron: "30 12 * * *"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Buscar resultados atuais
        run: |
          python - <<'PY'
          import json
          import urllib.request

          API = "https://api.guidi.dev.br/loteria"

          def buscar(numero):
              url = f"{API}/lotofacil/{numero}"

              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Our Lottery"}
              )

              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode("utf-8"))

          # Descobrimos o último concurso tentando a partir
          # do número atual conhecido e avançando.
          numero = 3769

          resultados = {}

          # Testa concursos recentes e anteriores
          for n in range(numero, numero - 40, -1):
              try:
                  dados = buscar(n)

                  dezenas = (
                      dados.get("dezenas")
                      or dados.get("listaDezenas")
                      or dados.get("Dezenas")
                  )

                  if isinstance(dezenas, str):
                      dezenas = [
                          int(x)
                          for x in dezenas.replace(",", " ").split()
                      ]

                  if dezenas:
                      dezenas = [int(x) for x in dezenas]

                  if len(dezenas) == 15:
                      resultados[str(n)] = dezenas
                      print(f"OK concurso {n}")

              except Exception as erro:
                  print(f"Falhou {n}: {erro}")

          if len(resultados) < 40:
              raise Exception(
                  f"Foram encontrados apenas {len(resultados)} concursos."
              )

          with open("resultados.json", "w", encoding="utf-8") as f:
              json.dump(
                  resultados,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print()
          print("================================")
          print("🍀 OUR LOTTERY")
          print("Último:", max(map(int, resultados.keys())))
          print("Total:", len(resultados))
          print("================================")
          PY

      - name: Salvar resultados
        run: |
          git config user.name "Our Lottery"
          git config user.email "actions@github.com"

          git add resultados.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteração."
          else
            git commit -m "🍀 Atualizar Lotofácil"
            git push
          fi
