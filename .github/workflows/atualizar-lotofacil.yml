name: Atualizar Lotofácil

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "*/15 20-23 * * *"
    - cron: "*/15 0-1 * * *"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Buscar resultados oficiais da Caixa
        run: |

          python - <<'PY'

          import json
          import urllib.request
          import time

          BASE = "https://servicebus2.caixa.gov.br/portaldeloterias/api/lotofacil"

          def buscar(url):

              url_com_cache_buster = (
                  url +
                  ("&" if "?" in url else "?") +
                  "_=" +
                  str(int(time.time()))
              )

              requisicao = urllib.request.Request(
                  url_com_cache_buster,
                  headers={
                      "User-Agent": "Mozilla/5.0",
                      "Cache-Control": "no-cache",
                      "Pragma": "no-cache"
                  }
              )

              with urllib.request.urlopen(
                  requisicao,
                  timeout=60
              ) as resposta:

                  return json.load(resposta)

          print("🍀 Consultando API da Caixa...")
          print("🔄 Forçando consulta nova...")

          ultimo = buscar(BASE)

          numero_atual = int(
              ultimo["numero"]
          )

          print("")
          print(
              "🎯 Último concurso encontrado:",
              numero_atual
          )

          resultados = {}

          for numero in range(
              numero_atual,
              max(0, numero_atual - 40),
              -1
          ):

              try:

                  dados = buscar(
                      BASE + "/" + str(numero)
                  )

                  dezenas = dados.get(
                      "listaDezenas",
                      []
                  )

                  dezenas = [
                      int(x)
                      for x in dezenas
                  ]

                  if (
                      len(dezenas) == 15
                      and all(
                          1 <= x <= 25
                          for x in dezenas
                      )
                  ):

                      resultados[
                          str(numero)
                      ] = dezenas

                      print(
                          "✅ Concurso",
                          numero
                      )

              except Exception as erro:

                  print(
                      "⚠️ Erro no concurso",
                      numero,
                      ":",
                      erro
                  )

          if not resultados:

              raise Exception(
                  "Nenhum resultado encontrado."
              )

          with open(
              "resultados.json",
              "w",
              encoding="utf-8"
          ) as arquivo:

              json.dump(
                  resultados,
                  arquivo,
                  ensure_ascii=False,
                  indent=2
              )

          ultimo_salvo = max(
              resultados.keys(),
              key=int
          )

          print("")
          print("==============================")
          print("🍀 OUR LOTTERY")
          print("==============================")
          print(
              "Último concurso salvo:",
              ultimo_salvo
          )
          print(
              "Total:",
              len(resultados)
          )
          print("==============================")

          PY

      - name: Conferir resultados
        run: |

          python - <<'PY'

          import json

          with open(
              "resultados.json",
              "r",
              encoding="utf-8"
          ) as arquivo:

              dados = json.load(arquivo)

          ultimo = max(
              dados.keys(),
              key=int
          )

          print("")
          print("🍀 RESULTADO FINAL")
          print(
              "Último concurso:",
              ultimo
          )
          print(
              "Dezenas:",
              dados[ultimo]
          )
          print(
              "Total:",
              len(dados)
          )

          PY

      - name: Salvar resultados no GitHub
        run: |

          git config user.name "Our Lottery"

          git config user.email "actions@github.com"

          git add resultados.json

          if git diff --cached --quiet; then

              echo "ℹ️ Nenhuma alteração nova."

          else

              git commit -m "🍀 Atualizar resultados oficiais"

              git pull --rebase origin main

              git push origin main

              echo "✅ Resultados salvos."

          fi
