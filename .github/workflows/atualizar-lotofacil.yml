name: Atualizar Lotofácil

on:
  workflow_dispatch:

  schedule:
    - cron: '*/15 * * * *'

jobs:

  atualizar:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Buscar resultado
        run: |

          python - <<'PY'

          import json
          import urllib.request

          url = "https://servicebus2.caixa.gov.br/portaldeloterias/api/lotofacil"

          req = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0",
                  "Accept": "application/json"
              }
          )

          with urllib.request.urlopen(req, timeout=30) as resposta:
              dados = json.loads(resposta.read().decode("utf-8"))

          concurso = str(dados["numero"])

          dezenas = [
              int(x)
              for x in dados["listaDezenas"]
          ]

          print("Concurso encontrado:", concurso)
          print("Dezenas:", dezenas)

          try:
              with open("resultados.json", "r", encoding="utf-8") as arquivo:
                  resultados = json.load(arquivo)
          except:
              resultados = {}

          resultados[concurso] = dezenas

          resultados = dict(
              sorted(
                  resultados.items(),
                  key=lambda x: int(x[0]),
                  reverse=True
              )[:40]
          )

          with open(
              "resultados.json",
              "w",
              encoding="utf-8"
          ) as arquivo:

              json.dump(
                  resultados,
                  arquivo,
                  ensure_ascii=False,
                  indent=2
              )

          PY

      - name: Salvar resultado no GitHub
        run: |

          git config user.name "Our Lottery Bot"

          git config user.email "actions@github.com"

          git add resultados.json

          git diff --cached --quiet || git commit -m "Atualiza resultados da Lotofácil"

          git push
