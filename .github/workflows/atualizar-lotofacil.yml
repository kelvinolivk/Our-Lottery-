name: Atualizar Lotofácil

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"
    - cron: "0 4 * * *"
    - cron: "0 13 * * *"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Atualizar resultados
        run: |

          python - <<'PY'

          import json
          import urllib.request
          import ssl
          import time

          # Fonte pública atualizada
          URL = "https://www.somatematica.com.br/lotofacil.php"

          headers = {
              "User-Agent": "Mozilla/5.0"
          }

          def baixar():

              req = urllib.request.Request(
                  URL,
                  headers=headers
              )

              for tentativa in range(3):

                  try:

                      with urllib.request.urlopen(
                          req,
                          timeout=30,
                          context=ssl.create_default_context()
                      ) as resposta:

                          return resposta.read().decode(
                              "utf-8",
                              errors="ignore"
                          )

                  except Exception as erro:

                      print(
                          "Tentativa",
                          tentativa + 1,
                          "falhou:",
                          erro
                      )

                      time.sleep(3)

              raise Exception(
                  "Não foi possível acessar a fonte."
              )


          print("🍀 OUR LOTTERY")
          print("🔎 Consultando resultados...")

          pagina = baixar()


          # -------------------------------------------------
          # Procurar concursos e suas dezenas
          # -------------------------------------------------

          import re

          resultados = {}

          padrao = re.compile(
              r'Concurso\s+(\d+).*?'
              r'((?:\b(?:0?[1-9]|1[0-9]|2[0-5])\b[\s,;-]*){15})',
              re.IGNORECASE | re.DOTALL
          )


          for match in padrao.finditer(pagina):

              numero = int(match.group(1))

              texto = match.group(2)

              dezenas = [
                  int(x)
                  for x in re.findall(
                      r'\b\d{1,2}\b',
                      texto
                  )
              ]

              dezenas = [
                  x for x in dezenas
                  if 1 <= x <= 25
              ]

              # Remove duplicados mantendo ordem
              dezenas = list(
                  dict.fromkeys(dezenas)
              )

              if len(dezenas) == 15:

                  resultados[str(numero)] = dezenas


          # -------------------------------------------------
          # IMPORTANTE
          # -------------------------------------------------

          # Se a página não permitir extrair os resultados,
          # não destrói o arquivo que já está funcionando.

          if not resultados:

              raise Exception(
                  "A fonte não retornou resultados válidos."
              )


          # -------------------------------------------------
          # Ordenar
          # -------------------------------------------------

          resultados = dict(
              sorted(
                  resultados.items(),
                  key=lambda item: int(item[0]),
                  reverse=True
              )
          )


          # -------------------------------------------------
          # Manter somente os 40 mais recentes
          # -------------------------------------------------

          resultados = dict(
              list(resultados.items())[:40]
          )


          ultimo = next(
              iter(resultados)
          )


          print()
          print("================================")
          print("🍀 OUR LOTTERY")
          print("================================")
          print("Último concurso:", ultimo)
          print("Concursos encontrados:", len(resultados))
          print("================================")


          # -------------------------------------------------
          # Salvar
          # -------------------------------------------------

          with open(
              "resultados.json",
              "w",
              encoding="utf-8"
          ) as arquivo:

              json.dump(
                  resultados,
                  arquivo,
                  ensure_ascii=False,
                  indent=2
              )


          print("✅ resultados.json atualizado.")

          PY


      - name: Salvar alterações
        run: |

          git config user.name "Our Lottery"
          git config user.email "actions@github.com"

          git add resultados.json

          if git diff --cached --quiet; then

            echo "ℹ️ Nenhuma alteração."

          else

            git commit -m "🍀 Atualizar resultados Lotofácil"

            git push

          fi
