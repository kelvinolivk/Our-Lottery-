name: Atualizar Lotofácil

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * *"
    - cron: "30 3 * * *"
    - cron: "30 12 * * *"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Atualizar resultados
        run: |

          python - <<'PY'

          import json
          import urllib.request
          import ssl
          import time

          API = "https://servicebus2.caixa.gov.br/portaldeloterias/api/lotofacil"

          headers = {
              "User-Agent": "Mozilla/5.0",
              "Accept": "application/json"
          }

          def buscar(url):

              requisicao = urllib.request.Request(
                  url,
                  headers=headers
              )

              for tentativa in range(3):

                  try:

                      with urllib.request.urlopen(
                          requisicao,
                          timeout=30,
                          context=ssl.create_default_context()
                      ) as resposta:

                          return json.loads(
                              resposta.read().decode("utf-8")
                          )

                  except Exception as erro:

                      print(
                          "Tentativa",
                          tentativa + 1,
                          "falhou:",
                          erro
                      )

                      time.sleep(3)

              raise Exception(
                  "Não foi possível consultar a fonte."
              )


          print("🍀 OUR LOTTERY")
          print("🔎 Buscando último concurso...")


          # =================================================
          # ÚLTIMO CONCURSO
          # =================================================

          ultimo = buscar(API)

          numero_atual = int(
              ultimo["numero"]
          )

          print(
              "Último concurso encontrado:",
              numero_atual
          )


          # =================================================
          # RESULTADOS
          # =================================================

          resultados = {}


          # Primeiro salva o último concurso
          dezenas = [
              int(x)
              for x in ultimo["listaDezenas"]
          ]

          if len(dezenas) == 15:

              resultados[
                  str(numero_atual)
              ] = dezenas


          # =================================================
          # BUSCAR OS 40 ANTERIORES
          # =================================================

          for numero in range(
              numero_atual - 1,
              numero_atual - 40,
              -1
          ):

              try:

                  print(
                      "Buscando concurso",
                      numero
                  )

                  dados = buscar(
                      API + "/" + str(numero)
                  )

                  dezenas = [
                      int(x)
                      for x in dados.get(
                          "listaDezenas",
                          []
                      )
                  ]

                  if (
                      len(dezenas) == 15
                      and all(
                          1 <= x <= 25
                          for x in dezenas
                      )
                  ):

                      resultados[
                          str(numero)
                      ] = dezenas

                      print(
                          "✅",
                          numero
                      )

              except Exception as erro:

                  print(
                      "⚠️ Não foi possível buscar",
                      numero,
                      erro
                  )


          # =================================================
          # ORDENAR
          # =================================================

          resultados = dict(
              sorted(
                  resultados.items(),
                  key=lambda item: int(item[0]),
                  reverse=True
              )
          )


          # =================================================
          # VERIFICAÇÃO
          # =================================================

          if not resultados:

              raise Exception(
                  "Nenhum resultado encontrado."
              )


          print()
          print(
              "🍀 ÚLTIMO:",
              max(
                  int(x)
                  for x in resultados.keys()
              )
          )

          print(
              "📊 TOTAL:",
              len(resultados)
          )


          # =================================================
          # SALVAR
          # =================================================

          with open(
              "resultados.json",
              "w",
              encoding="utf-8"
          ) as arquivo:

              json.dump(
                  resultados,
                  arquivo,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "✅ resultados.json atualizado."
          )

          PY


      - name: Salvar alterações
        run: |

          git config user.name "Our Lottery"
          git config user.email "actions@github.com"

          git add resultados.json

          if git diff --cached --quiet; then

            echo "ℹ️ Nenhuma alteração."

          else

            git commit -m "🍀 Atualizar resultados Lotofácil"

            git push

          fi
